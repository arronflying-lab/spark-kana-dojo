name: Deploy Spark adapter (Shanghai)

# Release safety rule: build on a GitHub-hosted runner. The 4 GB Shanghai host
# only downloads, verifies, installs, and restarts the already-built runtime.
on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Branch or tag to deploy
        required: true
        default: main
        type: string
      deploy_mode:
        description: Runtime transfer mode
        required: true
        default: artifact
        type: choice
        options: [artifact, local_build]

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy-spark-kana-dojo-shanghai
  cancel-in-progress: false

env:
  BASE_PATH: /kanadojo
  NODE_VERSION: '24'

jobs:
  build-runtime:
    name: Build runtime off production
    if: ${{ inputs.deploy_mode != 'local_build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      release_digest: ${{ steps.release.outputs.digest }}
      release_tag: ${{ steps.release_asset.outputs.tag }}
    steps:
      - name: Checkout requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and validate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          # `commitInfo.json` is deliberately generated and gitignored.  Create
          # it before typechecking so a clean hosted checkout follows the same
          # contract as `npm run build` and local development.
          node scripts/generate-commit-info.mjs
          npx tsc --noEmit --pretty false --incremental
          npm test -- --run features/SparkIntegration/__tests__/mappers.test.ts features/SparkIntegration/__tests__/portalVocabQuest.test.ts
          npm exec eslint features/SparkIntegration app/[locale]/vocabulary/spark/page.tsx -- --max-warnings=0

      - name: Build standalone runtime
        env:
          KANA_DOJO_BASE_PATH: /kanadojo
          NEXT_PUBLIC_KANA_DOJO_BASE_PATH: /kanadojo
          # Real server credentials are never available to the hosted runner
          # and are injected only at install.
          ANALYTICS_DISABLED: 'true'
          NEXT_PUBLIC_SENTRY_DISABLED: 'true'
          SENTRY_DISABLED: 'true'
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          npm run clean
          npm run build
          test -f .next/standalone/server.js

      - name: Package release runtime
        id: release
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/.next/standalone/.next
          cp -a .next/standalone/. release/.next/standalone/
          cp -a public release/.next/standalone/public
          cp -a .next/static release/.next/standalone/.next/static
          git rev-parse HEAD > release/RELEASE_SHA
          echo "sha=$(cat release/RELEASE_SHA)" >> "$GITHUB_OUTPUT"
          tar -czf kana-dojo-runtime.tgz -C release .
          echo "digest=$(sha256sum kana-dojo-runtime.tgz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          test -s kana-dojo-runtime.tgz

      - name: Publish temporary release asset
        id: release_asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="deploy-kana-dojo-${GITHUB_RUN_ID}"
          gh release create "$tag" kana-dojo-runtime.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Temporary KanaDojo deployment $GITHUB_RUN_ID" \
            --notes "Temporary runtime transfer asset; deleted after deployment." \
            --prerelease
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  install-runtime:
    name: Install runtime on Shanghai
    if: ${{ inputs.deploy_mode != 'local_build' }}
    needs: build-runtime
    # This repository's dedicated runner is intentionally separate from the
    # portal runner. It only installs an already-built artifact.
    runs-on: [self-hosted, linux, shanghai-kana-dojo]
    timeout-minutes: 15
    environment:
      name: production
      url: https://eju.japanedupath.com/kanadojo/spark
    env:
      APP_DIR: /var/www/spark-kana-dojo
      MAIN_APP_DIR: /var/www/japanedupath-internal
      PM2_APP: spark-kana-dojo
      RUNTIME_ENV: /var/www/spark-kana-dojo/.env.production
      HEALTH_URL: http://127.0.0.1:3102/kanadojo/api/healthcheck
      PAGE_URL: http://127.0.0.1:3102/kanadojo/spark
      RELEASE_SHA: ${{ needs.build-runtime.outputs.release_sha }}
      RELEASE_DIGEST: ${{ needs.build-runtime.outputs.release_digest }}
      RELEASE_TAG: ${{ needs.build-runtime.outputs.release_tag }}
    steps:
      - name: Download temporary release asset with retry and digest verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v curl sha256sum awk >/dev/null
          dest="$RUNNER_TEMP/kana-dojo-release"
          headers="$RUNNER_TEMP/kana-dojo-artifact.headers"
          archive="$dest/kana-dojo-runtime.tgz"
          mkdir -p "$dest"
          asset_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/kana-dojo-runtime.tgz"

          # Resolve the release CDN URL separately so the GitHub token is not
          # forwarded to the storage host on redirect.
          status="$(curl -sS --connect-timeout 15 --max-time 60 --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 180 \
            -D "$headers" -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" "$asset_url")"
          if [[ "$status" == 2* ]]; then
            curl -fL --connect-timeout 15 --max-time 900 --speed-limit 1024 --speed-time 30 \
              --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 900 \
              -H "Authorization: Bearer $GITHUB_TOKEN" "$asset_url" -o "$archive"
          else
            test "$status" = 302 || test "$status" = 301
            download_url="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub("\r$", ""); print substr($0, 11); exit }' "$headers")"
            test -n "$download_url"
            curl -fL --connect-timeout 15 --max-time 900 --speed-limit 1024 --speed-time 30 \
              --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 900 \
              "$download_url" -o "$archive"
          fi
          printf '%s  %s\n' "$RELEASE_DIGEST" "$archive" | sha256sum -c -
          test -s "$archive"

      - name: Verify server and release artifact
        run: |
          set -euo pipefail
          command -v node pm2 curl tar >/dev/null
          test -s "$RUNNER_TEMP/kana-dojo-release/kana-dojo-runtime.tgz"
          test -d "$MAIN_APP_DIR"
          test -f "$MAIN_APP_DIR/.env.production"

      - name: Prepare runtime-only environment
        run: |
          set -euo pipefail
          MAIN_ENV="$MAIN_APP_DIR/.env.production"
          read_value() {
            local name="$1"
            grep -E "^${name}=" "$MAIN_ENV" | tail -n 1 | cut -d= -f2-
          }
          url="$(read_value NEXT_PUBLIC_SUPABASE_URL || true)"
          [ -n "$url" ] || url="$(read_value SUPABASE_URL || true)"
          service_key="$(read_value SUPABASE_SERVICE_ROLE_KEY || true)"
          handoff_secret="$(read_value SPARK_KANA_DOJO_HANDOFF_SECRET || true)"
          test -n "$url" && test -n "$service_key" && test -n "$handoff_secret"
          umask 077
          mkdir -p "$APP_DIR"
          tmp_env="$(mktemp "$APP_DIR/.env.production.XXXXXX")"
          {
            printf 'SUPABASE_URL=%s\n' "$url"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_key"
            printf 'SPARK_KANA_DOJO_HANDOFF_SECRET=%s\n' "$handoff_secret"
            printf '%s\n' 'KANA_DOJO_BASE_PATH=/kanadojo' 'NEXT_PUBLIC_KANA_DOJO_BASE_PATH=/kanadojo' 'ANALYTICS_DISABLED=true' 'SENTRY_DISABLED=true' 'PORT=3102' 'HOSTNAME=127.0.0.1'
          } > "$tmp_env"
          chmod 600 "$tmp_env"
          mv "$tmp_env" "$RUNTIME_ENV"

      - name: Install with rollback and verify
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kana-dojo-release/kana-dojo-runtime.tgz"
          backup="$APP_DIR/.kana-dojo-previous"
          test "$backup" = '/var/www/spark-kana-dojo/.kana-dojo-previous'
          rm -rf "$backup"
          mkdir -p "$backup"
          if [ -d "$APP_DIR/.next/standalone" ]; then cp -a "$APP_DIR/.next/standalone" "$backup/standalone"; fi
          if [ -f "$APP_DIR/RELEASE_SHA" ]; then cp -a "$APP_DIR/RELEASE_SHA" "$backup/RELEASE_SHA"; fi
          rollback() {
            echo '::warning::KanaDojo health check failed; restoring previous runtime'
            rm -rf "$APP_DIR/.next/standalone"
            [ -d "$backup/standalone" ] && cp -a "$backup/standalone" "$APP_DIR/.next/standalone" || true
            [ -f "$backup/RELEASE_SHA" ] && cp -a "$backup/RELEASE_SHA" "$APP_DIR/RELEASE_SHA" || true
            pm2 restart "$PM2_APP" --update-env || true
          }
          trap rollback ERR
          rm -rf "$APP_DIR/.next/standalone"
          mkdir -p "$APP_DIR/.next"
          tar -xzf "$archive" -C "$APP_DIR"
          test "$(cat "$APP_DIR/RELEASE_SHA")" = "$RELEASE_SHA"
          set -a
          . "$RUNTIME_ENV"
          set +a
          if pm2 describe "$PM2_APP" >/dev/null 2>&1; then
            pm2 restart "$PM2_APP" --update-env
          else
            pm2 start .next/standalone/server.js --name "$PM2_APP" --cwd "$APP_DIR" --update-env
          fi
          pm2 save
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$HEALTH_URL" >/tmp/kana-dojo-health.json; then break; fi
            [ "$attempt" = 6 ] || sleep 2
          done
          test "$(cat /tmp/kana-dojo-health.json)" = '{"status":"ok"}'
          test "$(curl -fsS --max-time 10 -o /dev/null -w '%{http_code}' "$PAGE_URL")" = 200
          trap - ERR
          echo "KanaDojo runtime healthy at $(cat "$APP_DIR/RELEASE_SHA")"

  deploy-local-build:
    name: Build and install on Shanghai (fallback)
    if: ${{ inputs.deploy_mode == 'local_build' }}
    runs-on: [self-hosted, linux, shanghai-kana-dojo]
    timeout-minutes: 30
    environment:
      name: production
      url: https://eju.japanedupath.com/kanadojo/spark
    env:
      APP_DIR: /var/www/spark-kana-dojo
      MAIN_APP_DIR: /var/www/japanedupath-internal
      PM2_APP: spark-kana-dojo
      RUNTIME_ENV: /var/www/spark-kana-dojo/.env.production
      HEALTH_URL: http://127.0.0.1:3102/kanadojo/api/healthcheck
      PAGE_URL: http://127.0.0.1:3102/kanadojo/spark
      KANA_DOJO_BASE_PATH: /kanadojo
      NEXT_PUBLIC_KANA_DOJO_BASE_PATH: /kanadojo
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - name: Checkout requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref }}
          fetch-depth: 0

      - name: Validate and build locally before touching production
        run: |
          set -euo pipefail
          command -v node npm >/dev/null
          test "$(node -p 'process.versions.node.split(".")[0]')" = "$NODE_VERSION"
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/generate-commit-info.mjs
          npx tsc --noEmit --pretty false --incremental
          npm test -- --run features/SparkIntegration/__tests__/mappers.test.ts features/SparkIntegration/__tests__/portalVocabQuest.test.ts
          npm exec eslint features/SparkIntegration app/[locale]/vocabulary/spark/page.tsx -- --max-warnings=0
          npm run clean
          npm run build
          test -f .next/standalone/server.js

      - name: Prepare runtime-only environment
        run: |
          set -euo pipefail
          MAIN_ENV="$MAIN_APP_DIR/.env.production"
          read_value() {
            local name="$1"
            grep -E "^${name}=" "$MAIN_ENV" | tail -n 1 | cut -d= -f2-
          }
          url="$(read_value NEXT_PUBLIC_SUPABASE_URL || true)"
          [ -n "$url" ] || url="$(read_value SUPABASE_URL || true)"
          service_key="$(read_value SUPABASE_SERVICE_ROLE_KEY || true)"
          handoff_secret="$(read_value SPARK_KANA_DOJO_HANDOFF_SECRET || true)"
          test -n "$url" && test -n "$service_key" && test -n "$handoff_secret"
          umask 077
          mkdir -p "$APP_DIR"
          tmp_env="$(mktemp "$APP_DIR/.env.production.XXXXXX")"
          {
            printf 'SUPABASE_URL=%s\n' "$url"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_key"
            printf 'SPARK_KANA_DOJO_HANDOFF_SECRET=%s\n' "$handoff_secret"
            printf '%s\n' 'KANA_DOJO_BASE_PATH=/kanadojo' 'NEXT_PUBLIC_KANA_DOJO_BASE_PATH=/kanadojo' 'ANALYTICS_DISABLED=true' 'SENTRY_DISABLED=true' 'PORT=3102' 'HOSTNAME=127.0.0.1'
          } > "$tmp_env"
          chmod 600 "$tmp_env"
          mv "$tmp_env" "$RUNTIME_ENV"

      - name: Package, install, and verify with rollback
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/kana-dojo-local-release"
          archive="$RUNNER_TEMP/kana-dojo-local-runtime.tgz"
          rm -rf "$release_dir" "$archive"
          mkdir -p "$release_dir/.next/standalone/.next"
          cp -a .next/standalone/. "$release_dir/.next/standalone/"
          cp -a public "$release_dir/.next/standalone/public"
          cp -a .next/static "$release_dir/.next/standalone/.next/static"
          git rev-parse HEAD > "$release_dir/RELEASE_SHA"
          tar -czf "$archive" -C "$release_dir" .
          test -s "$archive"
          test -d "$MAIN_APP_DIR"
          test -f "$MAIN_APP_DIR/.env.production"
          command -v node pm2 curl tar >/dev/null

          backup="$APP_DIR/.kana-dojo-previous"
          test "$backup" = '/var/www/spark-kana-dojo/.kana-dojo-previous'
          rm -rf "$backup"
          mkdir -p "$backup"
          if [ -d "$APP_DIR/.next/standalone" ]; then cp -a "$APP_DIR/.next/standalone" "$backup/standalone"; fi
          if [ -f "$APP_DIR/RELEASE_SHA" ]; then cp -a "$APP_DIR/RELEASE_SHA" "$backup/RELEASE_SHA"; fi
          rollback() {
            echo '::warning::KanaDojo local-build health check failed; restoring previous runtime'
            rm -rf "$APP_DIR/.next/standalone"
            [ -d "$backup/standalone" ] && cp -a "$backup/standalone" "$APP_DIR/.next/standalone" || true
            [ -f "$backup/RELEASE_SHA" ] && cp -a "$backup/RELEASE_SHA" "$APP_DIR/RELEASE_SHA" || true
            pm2 restart "$PM2_APP" --update-env || true
          }
          trap rollback ERR
          rm -rf "$APP_DIR/.next/standalone"
          mkdir -p "$APP_DIR/.next"
          tar -xzf "$archive" -C "$APP_DIR"
          set -a
          . "$RUNTIME_ENV"
          set +a
          if pm2 describe "$PM2_APP" >/dev/null 2>&1; then
            pm2 restart "$PM2_APP" --update-env
          else
            pm2 start .next/standalone/server.js --name "$PM2_APP" --cwd "$APP_DIR" --update-env
          fi
          pm2 save
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$HEALTH_URL" >/tmp/kana-dojo-health.json; then break; fi
            [ "$attempt" = 6 ] || sleep 2
          done
          test "$(cat /tmp/kana-dojo-health.json)" = '{"status":"ok"}'
          test "$(curl -fsS --max-time 10 -o /dev/null -w '%{http_code}' "$PAGE_URL")" = 200
          trap - ERR
          rm -rf "$backup"
          echo "KanaDojo local-build runtime healthy at $(cat "$APP_DIR/RELEASE_SHA")"

  cleanup-release-asset:
    name: Remove temporary release asset
    needs: [build-runtime, install-runtime]
    if: ${{ always() && needs.build-runtime.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build-runtime.outputs.release_tag }}
    steps:
      - name: Delete temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
