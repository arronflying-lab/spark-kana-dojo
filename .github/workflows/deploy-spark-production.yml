name: Deploy Spark adapter (Shanghai)

# Safety interlock: the previous workflow built Next.js on the 4 GB production
# host and exhausted it. Deployment is disabled until the release artifact
# transfer is redesigned and verified without a server-side build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-interlocked:
    name: Deployment intentionally interlocked
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Deployment is interlocked: do not build KanaDojo on the Shanghai production host."
          echo "::error::Use a verified hosted-build artifact workflow before removing this interlock."
          exit 1